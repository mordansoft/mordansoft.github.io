<title>SaltCure on Google Play</title>
<!--
  Attribution hop. Every "Get it on Google Play" badge for SaltCure points here
  instead of straight at the store, for two reasons:
    1. The `referrer` parameter tags the install as coming from the site. Play
       Console shows it under acquisition sources, and the Play Install Referrer
       is read automatically by firebase_analytics on Android, so the source is
       attached to the user's first launch too.
    2. A view of this page IS a badge click. The site is static and has no event
       tracking of its own, so this is the only way to see how many visitors
       reach the store at all.
  The 1s delay is deliberate: it gives the analytics beacon time to fire before
  the browser leaves. Do not drop it to 0.
-->
<meta http-equiv="refresh" content="1; url=https://play.google.com/store/apps/details?id=com.mordansoft.saltcure&amp;referrer=utm_source%3Dmordansoft.com%26utm_medium%3Dreferral%26utm_campaign%3Dsaltcure_site">
