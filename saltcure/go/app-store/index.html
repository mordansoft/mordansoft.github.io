<title>SaltCure on the App Store</title>
<!--
  Attribution hop. Every "Download on the App Store" badge for SaltCure points
  here instead of straight at the store. A view of this page IS a badge click —
  the site is static and has no event tracking of its own.

  TODO (blocked on the Provider ID): Apple ignores utm_* parameters. To see
  these visits as a campaign in App Store Connect → App Analytics → Campaigns,
  the store URL below needs Apple's own parameters appended:

      ?pt=<PROVIDER_ID>&ct=saltcure_site&mt=8

  <PROVIDER_ID> is MordanSoft's Provider ID from App Store Connect (payments
  and financial reports). Until it is filled in, the link stays untagged and
  iOS installs cannot be attributed to the site — only the click count here is
  available. Changing it is a one-line edit in this file; the badges across the
  site do not need touching.

  The /us/ path segment was dropped on purpose so Apple serves each visitor
  their own country's storefront.

  The 1s delay is deliberate: it gives the analytics beacon time to fire before
  the browser leaves. Do not drop it to 0.
-->
<meta http-equiv="refresh" content="1; url=https://apps.apple.com/app/saltcure-meat-cure-calculator/id6812973901">
<style>
  :root { color-scheme: light dark; }

    a:hover { color: oklch(0.955 0.004 80); }
